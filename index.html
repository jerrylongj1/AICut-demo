<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const base=[{id:'street',title:'街头开场',type:'street',duration:8,headline:'HONG KONG',sub:'一座城，一段故事'},{id:'walk',title:'步行镜头',type:'street',duration:8,headline:'THE CITY',sub:'沿着街道慢慢走'},{id:'crowd',title:'街市人流',type:'street',duration:7,headline:'CITY WALK',sub:'穿过熙攘的人群'},{id:'ferry',title:'天星小轮',type:'ferry',duration:8,headline:'STAR FERRY',sub:'在海风里穿越维港'},{id:'harbor',title:'海港全景',type:'harbor',duration:8,headline:'THE HARBOUR',sub:'这一刻，值得停留'},{id:'repeat',title:'重复街景',type:'street',duration:7,headline:'AFTERNOON',sub:'街角的日常'},{id:'nature',title:'山海风景',type:'nature',duration:7,headline:'A QUIET MOMENT',sub:'城市之外的呼吸'},{id:'sunset',title:'日落收尾',type:'sunset',duration:7,headline:'SUNSET',sub:'把最后的光留给你'}];

function stageSet(s){stage=s;const names={entry:'准备就绪',loading:'正在分析',failed:'分析失败',plan:'3 项建议',result:'版本对比',done:'已完成'};$('stageBadge').textContent=names[s]||s;drawPanel()}
function drawPanel(){const p=$('panel');if(stage==='entry'){p.innerHTML=`<div class="eyebrow">01 / YOUR INTENT</div><h2>不满意？<br>告诉我哪里需要改。</h2><p class="description">不用寻找复杂的剪辑参数，用日常语言描述你的想法。AI 会先给出可解释的修改计划，经你确认后再执行。</p><label class="label" for="feedback">你的精修需求</label><textarea id="feedback" class="textarea" placeholder="例如：前 15 秒有点拖沓，但想保留海边镜头……">${esc(feedback)}</textarea><div class="quick"><button data-quick="开头节奏太慢了，希望更快进入主题。">⚡ 加快开头节奏</button><button data-quick="不要删掉海边全景，把最精彩的镜头提前。">✦ 保留重点镜头</button><button data-quick="日落结尾太短了，希望更有氛围感。">☀ 优化情绪结尾</button></div><div class="actions"><button class="btn primary fill" id="analyze">✦ 分析视频并生成精修计划 →</button><button class="btn flat fill" id="failTry">分析遇到问题？查看恢复方式</button></div>`;p.querySelector('#feedback').addEventListener('input',e=>feedback=e.target.value);p.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{feedback=b.dataset.quick;p.querySelector('#feedback').value=feedback});p.querySelector('#analyze').onclick=()=>startAnalysis(false);p.querySelector('#failTry').onclick=()=>startAnalysis(true)}
else if(stage==='loading'){p.innerHTML=`<div class="eyebrow">02 / UNDERSTANDING YOUR VIDEO</div><h2>正在理解你的创作意图</h2><p class="description">分析时间轴、镜头顺序与用户要求，尝试把主观反馈转化为具体剪辑操作。</p><div class="progress"><span id="bar" style="width:${analysisProgress}%"></span></div><div style="text-align:right;color:#bbb0e1;font-size:12px;margin-top:8px" id="percent">${analysisProgress}%</div><div class="step ${analysisProgress>20?'done':''}"><span class="stepicon">${analysisProgress>20?'✓':'1'}</span><div><strong>识别镜头结构</strong><div class="note">检查每个片段的时长与位置</div></div></div><div class="step ${analysisProgress>54?'done':''}"><span class="stepicon">${analysisProgress>54?'✓':'2'}</span><div><strong>解析自然语言反馈</strong><div class="note">识别“加快开头”“保留海边”“日落氛围”等要求</div></div></div><div class="step ${analysisProgress>86?'done':''}"><span class="stepicon">${analysisProgress>86?'✓':'3'}</span><div><strong>生成可执行计划</strong><div class="note">形成带时间范围的局部修改建议</div></div></div><button class="btn fill" id="cancel">停止分析</button>`;p.querySelector('#cancel').onclick=()=>{clearInterval(analysisTimer);stageSet('entry');toast('已停止分析，项目未更改')}}
else if(stage==='failed'){p.innerHTML=`<div class="eyebrow" style="color:#ffad9e">ANALYSIS INTERRUPTED</div><h2>暂时无法完成分析</h2><p class="description">分析超时，请重试或调整需求描述。当前编辑内容已保留。</p><div class="actions"><button class="btn primary fill" id="retry">↻ 重试分析</button><button class="btn fill" id="back">← 返回输入</button></div>`;p.querySelector('#retry').onclick=()=>startAnalysis(false);p.querySelector('#back').onclick=()=>stageSet('entry')}
else if(stage==='plan'){p.innerHTML=`<div class="eyebrow">03 / EDITING PLAN</div><h2>我找到了 3 处可以优化的地方</h2><p class="description">根据你的反馈，整理了以下修改建议。你可以逐项选择。</p><div id="plans">${suggestions.map((s,i)=>`<div class="plan"><div class="planhead"><input type="checkbox" id="check-${s.id}" ${selected.has(s.id)?'checked':''} aria-label="启用${esc(s.title)}"><strong>${i+1}. ${s.title}</strong></div><div style="margin:8px 0"><span class="time">${s.time}</span></div><p><b style="color:#dedbe6">诊断：</b>${s.diagnose}</p><p><b style="color:#dedbe6">动作：</b>${s.action}</p><p class="reason"><b>原因：</b>${s.reason}</p><button class="jump" data-jump="${i}">↗ 定位相关镜头</button></div>`).join('')}</div><div class="actions"><button class="btn primary fill" id="generate">✦ 生成所选修改的对比预览 →</button><button class="btn fill" id="rephrase">← 修改反馈内容</button></div>`;suggestions.forEach(s=>p.querySelector('#check-'+s.id).onchange=e=>{e.target.checked?selected.add(s.id):selected.delete(s.id)});p.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const targets=[0,23,53];mode='original';current=targets[+b.dataset.jump];playing=false;updatePreview();toast('已定位到 '+suggestions[+b.dataset.jump].time)});p.querySelector('#generate').onclick=()=>{if(!selected.size){toast('请至少选择一项修改建议');return}applied=true;accepted=false;mode='edited';current=0;playing=false;stageSet('result');updatePreview();toast('修改预览已就绪')};p.querySelector('#rephrase').onclick=()=>stageSet('entry')}
else if(stage==='result'){const before=total(base),after=total(modified());p.innerHTML=`<div class="eyebrow">04 / COMPARE & REVIEW</div><h2>把你的想法变成修改预览</h2><p class="description">已应用 ${selected.size} 项编辑。切换版本，对比效果。</p><div class="switch"><button id="original" class="${mode==='original'?'active':''}">◯ 原始版本</button><button id="edited" class="${mode==='edited'?'active':''}">✦ 修改后版本</button></div><div class="stats"><div class="stat"><strong>${before}s</strong><span>原版时长</span></div><div class="stat"><strong>${after}s</strong><span>修改后时长</span></div><div class="stat"><strong>${selected.size} 项</strong><span>采纳的编辑建议</span></div></div><div class="label">已应用的修改</div>${suggestions.filter(s=>selected.has(s.id)).map(s=>`<div class="iconline" style="font-size:12px;margin:10px 0;color:#c5c8d3"><span class="success">✓</span>${s.title}</div>`).join('')}<div class="divider"></div><div class="actions"><button class="btn primary fill" id="accept">✓ 接受当前修改方案</button><button class="btn fill" id="change">调整所选建议</button><button class="btn fill" id="iterate">继续提出反馈 / 再次精修</button><button class="btn flat fill" id="revert">↶ 撤销预览，恢复原版</button></div>`;p.querySelector('#original').onclick=()=>{mode='original';current=0;playing=false;drawPanel();updatePreview()};p.querySelector('#edited').onclick=()=>{mode='edited';current=0;playing=false;drawPanel();updatePreview()};p.querySelector('#accept').onclick=()=>{accepted=true;mode='edited';stageSet('done');updatePreview();toast('修改方案已接受；可导出编辑决策 JSON')};p.querySelector('#change').onclick=()=>{mode='original';playing=false;stageSet('plan');updatePreview()};p.querySelector('#iterate').onclick=()=>{mode='original';playing=false;stageSet('entry');updatePreview();toast('可继续补充你的审美偏好')};p.querySelector('#revert').onclick=()=>resetEditing(true)}
else if(stage==='done'){p.innerHTML=`<div class="eyebrow">05 / REVIEW COMPLETED</div><h2>精修方案已确认 ✓</h2><p class="description">已确认 ${selected.size} 项修改。你可以导出编辑方案或继续精修。</p><div class="stats"><div class="stat"><strong>${total(modified())}s</strong><span>当前版本时长</span></div><div class="stat"><strong>${selected.size} 项</strong><span>已确认操作</span></div></div><div class="actions"><button class="btn primary fill" id="save">↓ 导出编辑方案 JSON</button><button class="btn fill" id="more">✦ 继续精修</button><button class="btn fill" id="review">再次对比前后版本</button><button class="btn flat fill" id="undo">↶ 撤销所有 AI 修改</button></div>`;p.querySelector('#save').onclick=exportJSON;p.querySelector('#more').onclick=()=>{stageSet('entry');toast('你可以提出新一轮精修需求')};p.querySelector('#review').onclick=()=>{stageSet('result');mode='edited';updatePreview()};p.querySelector('#undo').onclick=()=>resetEditing(true)}
}
function updatePreview(){const arr=active(),d=total(arr);if(current>d)current=0;const s=sceneAt(current);$('scene').dataset.type=s.type;$('scenetitle').textContent=s.headline;$('scenesub').textContent=s.sub;$('sceneFlag').textContent=String(s.index+1).padStart(2,'0')+' / '+String(arr.length).padStart(2,'0')+' · '+s.title;$('versionFlag').textContent=(mode==='edited'&&applied?'✦ 修改后版本':'● 原始版本');$('clock').textContent=time(current)+' / '+time(d);$('seek').max=d;$('seek').value=current;$('durationLabel').textContent=d.toFixed(1)+' s';$('timelineBadge').textContent=mode==='edited'&&applied?'AI 修改时间轴':'原始时间轴';$('play').textContent=playing?'Ⅱ':'▶';let html='',start=0;for(let i=0;i<arr.length;i++){const c=arr[i];const isActive=i===s.index;html+=`<button class="clip ${isActive?'active':''}" data-type="${c.type}" data-index="${i}" style="flex:${c.duration}" title="${c.title} · ${c.duration}s">${c.title}<span style="position:absolute;right:4px;top:4px;font-size:9px;color:#fff9">${c.duration}s</span></button>`;start+=c.duration}$('clips').innerHTML=html+`<span class="playhead" style="left:${current/d*100}%"></span>`;$('clips').querySelectorAll('.clip').forEach(b=>b.onclick=()=>{let t=0;arr.slice(0,+b.dataset.index).forEach(c=>t+=c.duration);current=t;playing=false;updatePreview()})}
function startAnalysis(fail){feedback=feedback.trim();if(!feedback){toast('请先描述你想改进的地方');return}forcedFailure=fail;analysisProgress=0;clearInterval(analysisTimer);playing=false;mode='original';stageSet('loading');analysisTimer=setInterval(()=>{analysisProgress=Math.min(100,analysisProgress+9+Math.round(Math.random()*12));if(analysisProgress>=100){clearInterval(analysisTimer);stageSet(forcedFailure?'failed':'plan');if(!forcedFailure)toast('分析完成，已生成 3 项精修建议')}else drawPanel()},310)}
function resetEditing(show){clearInterval(analysisTimer);playing=false;current=0;mode='original';applied=false;accepted=false;selected=new Set(['trim','reorder','sunset']);stageSet('entry');updatePreview();if(show)toast('已撤销 AI 修改，恢复原始版本')}
function exportJSON(){const payload={product:'AI FineCut — 可演示原型',simulation:true,notice:'此文件为编辑决策清单，不是真实渲染后的视频',project:projectLabel,feedback,accepted,selected_suggestions:suggestions.filter(s=>selected.has(s.id)),original_timeline:base,modified_timeline:applied?modified():base,exported_at:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FineCut_编辑方案.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('编辑方案已导出（JSON）')}
$('play').onclick=()=>{if(uploadedUrl&&$('uploadedVideo').style.display!=='none'){const v=$('uploadedVideo');v.paused?v.play():v.pause();return}playing=!playing;updatePreview()};$('seek').oninput=e=>{current=Number(e.target.value);if(uploadedUrl&&$('uploadedVideo').style.display!=='none'&&isFinite($('uploadedVideo').duration))$('uploadedVideo').currentTime=current;updatePreview()};setInterval(()=>{if(playing){current+=.1;if(current>=total(active())){current=0;playing=false}updatePreview()}},100);$('resetTop').onclick=()=>resetEditing(true);$('resetProject').onclick=()=>resetEditing(true);$('exportTop').onclick=exportJSON;
$('fileInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(uploadedUrl)URL.revokeObjectURL(uploadedUrl);uploadedUrl=URL.createObjectURL(f);const v=$('uploadedVideo');v.src=uploadedUrl;v.style.display='block';$('scene').style.display='none';projectLabel=f.name;toast('当前精修建议基于示例项目，导入视频仅用于预览');$('projectName').innerHTML=esc(f.name)+' <span style="color:#777;font-weight:400">/ 本地预览</span>';v.onloadedmetadata=()=>{};v.onplay=()=>{$('play').textContent='Ⅱ'};v.onpause=()=>{$('play').textContent='▶'};v.ontimeupdate=()=>{$('clock').textContent=time(v.currentTime)+' / '+time(v.duration||0)};resetEditing(false)};
stageSet('entry');updatePreview();})();
</script>
</body></html>
